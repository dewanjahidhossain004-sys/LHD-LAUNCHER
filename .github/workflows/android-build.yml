name: Build Android APK (Updated)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # Updated to v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        # This action automatically handles NDK and SDK platforms, simplifying the setup.
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        # Use clean and assembleRelease for a clean build
        run: ./gradlew clean assembleRelease --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4 # Confirmed v4
        with:
          name: pojav-release-apk
          path: |
            **/build/outputs/**/*.apk
            **/*.apk
